name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  nbb-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: kotoba-lang/kotobase
          # Same pin as deps.edn — keep the two in lockstep.
          ref: bbf57df9dde5c1869182012860129a598382e088
          path: .deps/kotobase
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global nbb
      # Phase 1 core (kotobase.sftp.fs, pure .cljc) + transport unit-level
      # wire/kex tests (kotobase.sftp.transport.*, .cljs-only). Both run
      # together via bin/run_tests.cljk (cljs.test), same as
      # kotobase-protocols's own single nbb test entrypoint.
      - run: nbb --classpath "src:test:.deps/kotobase/src" bin/run_tests.cljk
      # The real cross-process SSH/SFTP demo (spawns a second nbb OS
      # process, connects over a real socket — same verification style as
      # kotoba-lang/dtn's tcp_demo.cljs). Kept as a separate CI step (not
      # folded into cljs.test) so its pass/fail and stdout are easy to
      # read on their own; see the demo file's own docstring for exactly
      # what it does and does not prove.
      - run: nbb --classpath "src:test:.deps/kotobase/src" test/kotobase/sftp/transport/ssh_demo.cljk
